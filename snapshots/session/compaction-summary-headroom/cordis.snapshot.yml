- id: spill-local
  config:
    root: !!js process.env.DSH_SNAPSHOT_SPILL_ROOT

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.DSH_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.DSH_SNAPSHOT_SPILL_LOCATOR_ROOT

# The hard summary cap inherits 1,800-token headroom; its independent checkpoint
# target is 512 tokens. A 1,000-token output reservation lowers the trigger to 6,200.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20
    summaryTargetTokens: 512
    maxSummaryRatio: 0.35

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 9000
                defaultMaxTokens: 1000
