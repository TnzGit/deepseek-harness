name: TNZ migration validation

on:
  push:
    branches:
      - 2026-09-25_dsh-0-1-7-integration

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          package-manager-cache: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run local-inference LLM regressions
        run: >-
          pnpm exec vitest run
          packages/llm/llm-pi-ai/tests/convert.spec.ts
          packages/llm/llm-deepseek/tests/stream.spec.ts
      - name: Lint changed LLM files
        run: >-
          pnpm exec oxlint
          packages/llm/llm-pi-ai/src/stream.ts
          packages/llm/llm-pi-ai/tests/convert.spec.ts
          packages/llm/llm-deepseek/src/translate.ts
          packages/llm/llm-deepseek/tests/stream.spec.ts
