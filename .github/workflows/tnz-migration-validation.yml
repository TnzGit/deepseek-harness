name: TNZ migration validation

on:
  push:
    branches:
      - 2026-09-25_dsh-0-1-7-integration

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          package-manager-cache: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run local-inference migration regressions
        run: >-
          pnpm exec vitest run
          packages/subagent/subagent/tests/run-admission.spec.ts
          packages/subagent/subagent/tests/service.spec.ts
          packages/llm/llm-pi-ai/tests/convert.spec.ts
          packages/llm/llm-pi-ai/tests/adapter.spec.ts
          packages/llm/llm-deepseek/tests/stream.spec.ts
          packages/util/timeout/tests/timeout.spec.ts
          packages/llm/llm/tests/retry-policy.spec.ts
          packages/llm/llm-retry/tests/retry.spec.ts
      - name: Lint changed migration files
        run: >-
          pnpm exec oxlint
          packages/subagent/subagent/src/run-admission.ts
          packages/subagent/subagent/src/index.ts
          packages/subagent/subagent/tests/run-admission.spec.ts
          packages/subagent/subagent/tests/service.spec.ts
          packages/llm/llm-pi-ai/src/stream.ts
          packages/llm/llm-pi-ai/src/adapter.ts
          packages/llm/llm-pi-ai/src/config.ts
          packages/llm/llm-pi-ai/tests/convert.spec.ts
          packages/llm/llm-pi-ai/tests/adapter.spec.ts
          packages/llm/llm-pi-ai/tests/mock-server.ts
          packages/llm/llm-deepseek/src/translate.ts
          packages/llm/llm-deepseek/tests/stream.spec.ts
          packages/util/timeout/src/index.ts
          packages/util/timeout/tests/timeout.spec.ts
          packages/llm/llm/src/retry-policy.ts
          packages/llm/llm/tests/retry-policy.spec.ts
          packages/llm/llm-retry/src/index.ts
          packages/llm/llm-retry/tests/retry.spec.ts
